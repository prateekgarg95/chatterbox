[project]
name = "chatterbox-tts"
version = "0.1.7"
description = "Chatterbox: Open Source TTS and Voice Conversion by Resemble AI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    # numpy 1.x for Python < 3.13 (no 1.x wheels on 3.13+), numpy 2.x for 3.13+
    "numpy>=1.24.0,<2.0.0; python_version < '3.13'",
    "numpy>=2.0.0; python_version >= '3.13'",
    "librosa==0.11.0",
    "s3tokenizer",
    # torch 2.6.0 supports Python 3.10-3.13; Python 3.14 needs 2.9.0+
    "torch==2.6.0; python_version < '3.14'",
    "torch>=2.9.0; python_version >= '3.14'",
    "torchaudio==2.6.0; python_version < '3.14'",
    "torchaudio>=2.9.0; python_version >= '3.14'",
    # Was ==5.2.0 (just "latest at the time" from an upstream PR, #491 -
    # no compatibility rationale tied to this exact version). Bumped to
    # 5.15.0 after finding a real, confirmed ~4.2x .generate() slowdown
    # on 5.2.0 for ByT5 (google/byt5-small) - reproduced side-by-side on
    # the same GPU, same model, same inputs, identical output: 375.7ms
    # vs 88.6ms for 5 transliteration windows. Needed for
    # chatterbox-hinglish's byt5-hindi-sentence-transliteration
    # normalisation step (engines/chatterbox_hinglish/core/
    # transliteration_byt5.py), which shares this venv with T3/S3Gen.
    "transformers==5.15.0",
    "diffusers==0.29.0",
    "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@master",
    "conformer==0.3.2",
    "safetensors==0.5.3",
    "spacy-pkuseg",
    "pykakasi==2.3.0",
    "gradio==6.8.0",
    "pyloudnorm",
    "omegaconf"
]

[project.urls]
Homepage = "https://github.com/resemble-ai/chatterbox"
Repository = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
